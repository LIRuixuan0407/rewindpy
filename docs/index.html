<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RewindPy</title>
<style>
:root {
  color-scheme: dark;
  --bg: #080a10;
  --panel: #0d111a;
  --panel2: #121824;
  --panel3: #182131;
  --border: #263247;
  --text: #eef2ff;
  --muted: #8e9bb0;
  --accent: #7c8cff;
  --accent2: #51d6c7;
  --danger: #fb7185;
  --warning: #fbbf24;
  --success: #86efac;
  --line: #1b2535;
  --shadow: 0 20px 60px rgba(0,0,0,.35);
  --header: 68px;
  --transport: 116px;
  --explorer: 238px;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f5f9;
  --panel: #fff;
  --panel2: #f8fafc;
  --panel3: #edf2f7;
  --border: #d8e0ec;
  --text: #152033;
  --muted: #66758c;
  --line: #edf1f6;
  --shadow: 0 18px 48px rgba(31,41,55,.12);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text);
  background: radial-gradient(circle at 15% -20%, rgba(124,140,255,.16), transparent 35%), var(--bg);
}
button, input, select { font: inherit; }
button { color: inherit; }
.app-header {
  position: fixed; z-index: 30; inset: 0 0 auto; height: var(--header);
  display: flex; align-items: center; gap: 14px; padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(18px);
}
.logo {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: linear-gradient(145deg, rgba(124,140,255,.28), rgba(81,214,199,.1));
  border: 1px solid rgba(124,140,255,.38); font-weight: 900;
}
.brand { min-width: 0; flex: 1; }
.brand h1 { font-size: 15px; margin: 0; }
.crash {
  margin-top: 4px; color: var(--danger);
  font: 12px ui-monospace, SFMono-Regular, Consolas, monospace;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.header-actions { display: flex; align-items: center; gap: 7px; }
.btn, .seg button {
  height: 36px; padding: 0 11px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--panel2); color: var(--muted); cursor: pointer;
  font-size: 12px; font-weight: 700;
}
.btn:hover, .seg button:hover { color: var(--text); background: var(--panel3); }
.btn.success { color: var(--success); }
.seg { height: 38px; display: flex; padding: 3px; border: 1px solid var(--border); border-radius: 11px; background: var(--panel); }
.seg button { height: 30px; border: 0; background: transparent; }
.seg button.active { color: var(--text); background: var(--panel3); }
#languageToggle { width: 72px; }
.workspace {
  position: fixed; inset: var(--header) 0 var(--transport);
  display: grid; grid-template-columns: var(--explorer) minmax(0, 1.55fr) minmax(350px, .85fr);
  gap: 10px; padding: 10px; overflow: hidden;
}
.panel {
  min-width: 0; min-height: 0; overflow: hidden;
  border: 1px solid var(--border); border-radius: 14px;
  background: color-mix(in srgb, var(--panel) 96%, transparent); box-shadow: var(--shadow);
}
.panel-head {
  height: 46px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 0 13px; border-bottom: 1px solid var(--border); background: var(--panel2);
}
.panel-title { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.panel-actions { display: flex; align-items: center; gap: 6px; }
.mini-btn {
  height: 29px; padding: 0 9px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel); color: var(--muted); cursor: pointer; font-size: 11px;
}
.mini-btn:hover { color: var(--text); background: var(--panel3); }
.file-name {
  min-width: 0; max-width: 72%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Consolas, monospace;
}
.explorer-body { height: calc(100% - 46px); overflow: auto; padding: 8px 6px 20px; }
.tree-group { margin-left: 8px; }
.tree-folder { margin: 1px 0; }
.tree-folder > summary {
  min-height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 6px;
  border-radius: 7px; color: var(--muted); cursor: pointer; list-style: none;
  font: 11px ui-monospace, SFMono-Regular, Consolas, monospace;
}
.tree-folder > summary::-webkit-details-marker { display: none; }
.tree-folder > summary::before { content: "▾"; width: 12px; color: #64748b; }
.tree-folder:not([open]) > summary::before { content: "▸"; }
.tree-folder > summary:hover { color: var(--text); background: var(--panel3); }
.file-item {
  width: 100%; min-height: 30px; display: grid; grid-template-columns: 17px minmax(0,1fr) auto;
  align-items: center; gap: 5px; padding: 0 7px; border: 0; border-radius: 7px;
  background: transparent; color: var(--muted); cursor: pointer; text-align: left;
  font: 11px ui-monospace, SFMono-Regular, Consolas, monospace;
}
.file-item:hover { color: var(--text); background: var(--panel3); }
.file-item.active { color: var(--text); background: rgba(124,140,255,.16); }
.file-icon { color: var(--accent2); }
.file-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-count {
  min-width: 22px; padding: 1px 5px; border-radius: 999px; text-align: center;
  background: var(--panel3); color: var(--muted); font: 9px ui-monospace, monospace;
}
.code-panel { position: relative; }
.source-search {
  position: absolute; z-index: 8; top: 52px; right: 14px; width: min(430px, calc(100% - 28px));
  display: none; align-items: center; gap: 6px; padding: 7px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--panel2); box-shadow: var(--shadow);
}
.source-search.open { display: flex; }
.source-search input {
  min-width: 0; flex: 1; height: 31px; padding: 0 9px;
  border: 1px solid var(--border); border-radius: 7px; outline: none;
  background: var(--panel); color: var(--text); font: 12px ui-monospace, monospace;
}
.source-search input:focus { border-color: var(--accent); }
.search-counter { min-width: 48px; color: var(--muted); text-align: center; font: 10px ui-monospace, monospace; }
.code-scroll { height: calc(100% - 46px); overflow: auto; scrollbar-gutter: stable; }
.code-line {
  display: grid; grid-template-columns: 34px 50px minmax(0,1fr); min-height: 24px;
  border-left: 3px solid transparent; font: 13px/24px ui-monospace, SFMono-Regular, Consolas, monospace;
}
.code-line:hover { background: rgba(124,140,255,.05); }
.code-line.active { background: rgba(124,140,255,.14); border-left-color: var(--accent); }
.code-line.crash-line { box-shadow: inset 0 0 0 1px rgba(251,113,133,.35); }
.code-line.origin-line:not(.active) { background: rgba(251,191,36,.08); border-left-color: var(--warning); }
.code-line.search-line:not(.active) { background: rgba(251,191,36,.05); }
.arrow { text-align: center; color: transparent; }
.active .arrow { color: var(--accent2); }
.line-no { padding-right: 10px; text-align: right; color: #58667c; user-select: none; }
.code { white-space: pre; padding-right: 20px; }
mark.search-match { padding: 0 1px; border-radius: 2px; background: rgba(251,191,36,.5); color: inherit; }
mark.search-match.current { outline: 1px solid var(--warning); background: rgba(251,191,36,.78); }
.kw { color: #c792ea; } .str { color: #c3e88d; } .num { color: #f78c6c; }
.com { color: #637777; font-style: italic; } .fn { color: #82aaff; }
.right { display: grid; grid-template-rows: minmax(180px,.72fr) minmax(230px,1fr); gap: 10px; min-height: 0; }
.event-card { height: calc(100% - 46px); padding: 14px; overflow: auto; }
.event-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
.metric { padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel2); }
.metric label { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
.metric b { display: block; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px ui-monospace, monospace; }
.origin { margin-top: 10px; padding: 11px; border: 1px solid rgba(251,191,36,.25); border-radius: 11px; background: rgba(251,191,36,.07); }
.origin h3 { margin: 0 0 6px; color: var(--warning); font-size: 11px; text-transform: uppercase; }
.origin p { margin: 0 0 9px; color: var(--muted); font-size: 12px; line-height: 1.55; }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tab { height: 30px; padding: 0 9px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 700; white-space: nowrap; }
.tab.active { color: var(--text); background: var(--panel3); }
.tab-body { height: calc(100% - 46px); padding: 10px; overflow: auto; }
.variable { padding: 8px 6px; border-bottom: 1px solid var(--line); }
.variable:last-child { border-bottom: 0; }
.var-top { display: flex; justify-content: space-between; gap: 10px; }
.var-name { color: var(--accent2); font: 12px ui-monospace, monospace; }
.var-type { color: var(--muted); font-size: 10px; }
.var-value { margin-top: 5px; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, monospace; }
.variable.changed { border-radius: 8px; background: rgba(124,140,255,.07); }
.change { padding: 9px; border-bottom: 1px solid var(--line); font: 12px ui-monospace, monospace; }
.before { color: var(--danger); } .after { color: var(--success); }
.frame { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid var(--line); cursor: pointer; }
.frame:hover { background: var(--panel3); }
.frame-depth { width: 22px; color: var(--muted); font: 10px monospace; }
.frame-main { min-width: 0; }
.frame-fn { color: var(--accent2); font: 12px monospace; }
.frame-loc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font: 10px monospace; }
.exception-chain { display: flex; flex-direction: column; gap: 8px; }
.exception-node { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel2); color: var(--text); cursor: pointer; text-align: left; }
.exception-node:hover, .exception-node.selected { border-color: var(--accent); background: rgba(124,140,255,.1); }
.exception-role { margin-bottom: 4px; color: var(--muted); font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.exception-type { color: var(--danger); font: 12px ui-monospace, monospace; }
.exception-message { margin-top: 4px; color: var(--text); font-size: 11px; line-height: 1.45; }
.exception-location { margin-top: 5px; color: var(--muted); font: 10px ui-monospace, monospace; }
.exception-relation { margin-left: 14px; color: var(--muted); font-size: 10px; }
.exception-notes { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line); color: var(--warning); font-size: 10px; line-height: 1.45; }
.chain-warning { padding: 8px; border: 1px solid rgba(251,191,36,.3); border-radius: 8px; color: var(--warning); font-size: 10px; }
.transport {
  position: fixed; z-index: 20; inset: auto 0 0; height: var(--transport);
  padding: 10px 18px; border-top: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(18px);
}
.transport-top { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 14px; }
.controls { display: flex; gap: 6px; }
.icon-btn { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel2); color: var(--text); cursor: pointer; }
.icon-btn:hover { background: var(--panel3); }
.timeline-wrap { min-width: 0; }
.timeline-meta { display: flex; justify-content: space-between; margin-bottom: 4px; color: var(--muted); font: 10px ui-monospace, monospace; }
input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
.speed { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
.speed select { height: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel2); color: var(--text); }
.stats { margin-top: 9px; display: flex; align-items: center; gap: 14px; overflow: hidden; color: var(--muted); font: 10px ui-monospace, monospace; white-space: nowrap; }
.stats span { overflow: hidden; text-overflow: ellipsis; }
.toast { position: fixed; z-index: 60; right: 18px; bottom: 132px; padding: 10px 13px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel3); box-shadow: var(--shadow); font-size: 12px; opacity: 0; transform: translateY(6px); pointer-events: none; transition: .18s; }
.toast.show { opacity: 1; transform: none; }
.overlay { position: fixed; z-index: 80; inset: 0; display: none; align-items: flex-start; justify-content: center; padding-top: 11vh; background: rgba(3,5,10,.62); backdrop-filter: blur(7px); }
.overlay.open { display: flex; }
.palette { width: min(680px, calc(100% - 30px)); max-height: 72vh; overflow: hidden; border: 1px solid var(--border); border-radius: 15px; background: var(--panel); box-shadow: 0 26px 90px rgba(0,0,0,.55); }
.palette-head { display: flex; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid var(--border); }
.palette-head input { min-width: 0; flex: 1; height: 39px; padding: 0 11px; border: 1px solid var(--border); border-radius: 9px; outline: none; background: var(--panel2); color: var(--text); font: 13px ui-monospace, monospace; }
.palette-head input:focus { border-color: var(--accent); }
.key-hint { padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font: 9px ui-monospace, monospace; }
.palette-results { max-height: calc(72vh - 60px); overflow: auto; padding: 7px; }
.palette-result { width: 100%; display: grid; grid-template-columns: 20px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text); cursor: pointer; text-align: left; }
.palette-result:hover, .palette-result.selected { background: var(--panel3); }
.result-main { min-width: 0; }
.result-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px ui-monospace, monospace; }
.result-subtitle { margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 10px; }
.result-kind { color: var(--muted); font-size: 9px; text-transform: uppercase; }
.empty-state { padding: 18px; color: var(--muted); text-align: center; font-size: 12px; }
.report-error { position: fixed; z-index: 200; inset: 0; display: none; place-items: center; padding: 28px; background: #080a10; color: #eef2ff; }
.report-error-card { width: min(720px,100%); padding: 24px; border: 1px solid #3b465b; border-radius: 16px; background: #111827; box-shadow: var(--shadow); }
.report-error h1 { margin: 0 0 10px; color: #fb7185; font-size: 20px; }
.report-error p { margin: 7px 0; color: #cbd5e1; line-height: 1.6; }
.report-error pre { max-height: 180px; overflow: auto; padding: 12px; border-radius: 10px; background: #070b12; color: #94a3b8; white-space: pre-wrap; }
@media (max-width: 1080px) {
  :root { --explorer: 205px; }
  .workspace { grid-template-columns: var(--explorer) minmax(0,1fr); }
  .right { display: none; }
}
@media (max-width: 760px) {
  :root { --header: 112px; --transport: 126px; }
  .app-header { height: var(--header); align-items: flex-start; padding-top: 12px; flex-wrap: wrap; }
  .brand { width: calc(100% - 56px); }
  .header-actions { width: 100%; overflow-x: auto; padding-bottom: 8px; }
  .workspace { grid-template-columns: 1fr; }
  .explorer-panel { display: none; }
  .shortcut-only { display: none; }
}
</style>
</head>
<body>
<header class="app-header">
  <div class="logo">R</div>
  <div class="brand"><h1 id="reportTitle">RewindPy</h1><div id="crashText" class="crash"></div></div>
  <div class="header-actions">
    <div class="seg"><button id="sliceView"></button><button id="allView"></button></div>
    <button id="quickOpenButton" class="btn" title="Ctrl+P">⌘P</button>
    <button id="globalSearchButton" class="btn" title="Ctrl+Shift+F">⌕</button>
    <button id="openSource" class="btn shortcut-only"></button>
    <button id="copyDiagnostic" class="btn shortcut-only"></button>
    <button id="copyLocation" class="btn shortcut-only"></button>
    <button id="themeToggle" class="btn" aria-label="Theme">☀</button>
    <button id="languageToggle" class="btn"></button>
  </div>
</header>
<main class="workspace">
  <aside class="panel explorer-panel" id="fileExplorer">
    <div class="panel-head"><span class="panel-title" id="filesTitle"></span><span id="fileTotal" class="file-count"></span></div>
    <div class="explorer-body" id="fileTree"></div>
  </aside>
  <section class="panel code-panel">
    <div class="panel-head">
      <span class="panel-title" id="sourceTitle"></span>
      <div class="panel-actions"><span class="file-name" id="fileName"></span><button class="mini-btn" id="sourceSearchButton" title="Ctrl+F">⌕</button></div>
    </div>
    <div class="source-search" id="sourceSearch">
      <input id="sourceSearchInput" autocomplete="off" spellcheck="false" />
      <span id="sourceSearchCount" class="search-counter">0 / 0</span>
      <button class="mini-btn" id="sourceSearchPrev">↑</button>
      <button class="mini-btn" id="sourceSearchNext">↓</button>
      <button class="mini-btn" id="sourceSearchClose">×</button>
    </div>
    <div class="code-scroll" id="codeScroll"><div id="code"></div></div>
  </section>
  <section class="right">
    <div class="panel">
      <div class="panel-head"><span class="panel-title" id="currentEventTitle"></span><span class="file-name" id="eventBadge"></span></div>
      <div class="event-card">
        <div class="event-grid">
          <div class="metric"><label id="functionLabel"></label><b id="functionValue"></b></div>
          <div class="metric"><label id="locationLabel"></label><b id="locationValue"></b></div>
          <div class="metric"><label id="eventLabel"></label><b id="eventValue"></b></div>
          <div class="metric"><label id="depthLabel"></label><b id="depthValue"></b></div>
        </div>
        <div class="origin" id="originCard"><h3 id="originTitle"></h3><p id="originText"></p><button id="jumpOrigin" class="btn"></button></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><div class="tabs">
        <button class="tab active" id="variablesTab" data-tab="variables"></button>
        <button class="tab" id="changesTab" data-tab="changes"></button>
        <button class="tab" id="stackTab" data-tab="stack"></button>
        <button class="tab" id="exceptionsTab" data-tab="exceptions"></button>
      </div></div>
      <div class="tab-body" id="tabBody"></div>
    </div>
  </section>
</main>
<footer class="transport">
  <div class="transport-top">
    <div class="controls"><button id="prev" class="icon-btn">◀</button><button id="play" class="icon-btn">▶</button><button id="next" class="icon-btn">▶</button></div>
    <div class="timeline-wrap"><div class="timeline-meta"><span id="timelineTitle"></span><span id="stepText"></span></div><input id="slider" type="range" min="0" value="0" /></div>
    <label class="speed"><span id="speedLabel"></span><select id="speed"><option value="900">0.5×</option><option value="450" selected>1×</option><option value="220">2×</option><option value="110">4×</option></select></label>
  </div>
  <div class="stats" id="stats"></div><div class="stats" id="shortcuts"></div>
</footer>
<div class="toast" id="toast"></div>
<div class="overlay" id="quickOpen" role="dialog" aria-modal="true">
  <div class="palette"><div class="palette-head"><input id="quickOpenInput" autocomplete="off" spellcheck="false" /><span class="key-hint">Ctrl+P</span><span class="key-hint">Esc</span></div><div class="palette-results" id="quickOpenResults"></div></div>
</div>
<div class="overlay" id="globalSearch" role="dialog" aria-modal="true">
  <div class="palette"><div class="palette-head"><input id="globalSearchInput" autocomplete="off" spellcheck="false" /><span class="key-hint">Ctrl+Shift+F</span><span class="key-hint">Esc</span></div><div class="palette-results" id="globalSearchResults"></div></div>

$('quickOpenInput').oninput=()=>{state.quickIndex=0;renderQuickOpen()};$('quickOpenInput').onkeydown=event=>{if(event.key==='ArrowDown'){event.preventDefault();state.quickIndex=Math.min(state.quickResults.length-1,state.quickIndex+1);renderQuickOpen()}if(event.key==='ArrowUp'){event.preventDefault();state.quickIndex=Math.max(0,state.quickIndex-1);renderQuickOpen()}if(event.key==='Enter'){event.preventDefault();chooseQuick()}if(event.key==='Escape')closeOverlays()};
$('globalSearchInput').oninput=()=>{state.globalIndex=0;renderGlobalSearch()};$('globalSearchInput').onkeydown=event=>{if(event.key==='ArrowDown'){event.preventDefault();state.globalIndex=Math.min(state.globalResults.length-1,state.globalIndex+1);renderGlobalSearch()}if(event.key==='ArrowUp'){event.preventDefault();state.globalIndex=Math.max(0,state.globalIndex-1);renderGlobalSearch()}if(event.key==='Enter'){event.preventDefault();chooseGlobal()}if(event.key==='Escape')closeOverlays()};
document.querySelectorAll('.overlay').forEach(element=>element.onclick=event=>{if(event.target===element)closeOverlays()});
document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{state.activeTab=tab.dataset.tab;document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===tab));renderTab(current())});
document.addEventListener('keydown',event=>{
  const key=event.key.toLowerCase();
  if((event.ctrlKey||event.metaKey)&&key==='p'){event.preventDefault();showQuickOpen();return}
  if((event.ctrlKey||event.metaKey)&&event.shiftKey&&key==='f'){event.preventDefault();showGlobalSearch();return}
  if((event.ctrlKey||event.metaKey)&&key==='f'){event.preventDefault();showSourceSearch();return}
  if(event.key==='Escape'){closeOverlays();return}
  if(['INPUT','SELECT','TEXTAREA'].includes(event.target.tagName))return;
  if(event.key==='ArrowLeft'||key==='j'){event.preventDefault();move(-1)}
  if(event.key==='ArrowRight'||key==='k'){event.preventDefault();move(1)}
  if(event.code==='Space'){event.preventDefault();togglePlay()}
  if (key === 'o') openCurrentSource();
  if (key === 'c') copy(diagnosticText());
  if (key === 'l') copy(locationText());
});
$('crashText').textContent=`${payload.crash?.exception_type||'Error'}: ${payload.crash?.message||''}`;state.events=selectEvents();state.index=Math.max(0,state.events.length-1);setMode(state.mode,current()?.step);applyLanguage();
}catch(error){showReportError(error)}
</script>
</body>
</html>
