name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing release tag to build and publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_REF: ${{ inputs.ref || github.ref_name }}

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify release tag and package version
        shell: bash
        run: |
          case "${RELEASE_REF}" in
            v*.*.*) ;;
            *) echo "Release ref must be a version tag such as v0.1.0" >&2; exit 1 ;;
          esac
          package_version=$(python -c "from pathlib import Path; import re; print(re.search(r'__version__ = \"([^\"]+)\"', Path('src/rewindpy/__init__.py').read_text()).group(1))")
          pyproject_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${package_version}" = "${pyproject_version}"
          test "v${package_version}" = "${RELEASE_REF}"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke-test the built wheel
        shell: bash
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --upgrade pip
          .release-smoke/bin/python -m pip install --no-deps dist/*.whl
          .release-smoke/bin/rewindpy --version
          .release-smoke/bin/rewindpy --lang en doctor
          .release-smoke/bin/rewindpy --lang en demo multi-file --output release-smoke.html
          test -s release-smoke.html

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_REF }}
          generate_release_notes: true
          files: dist/*

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rewindpy
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
